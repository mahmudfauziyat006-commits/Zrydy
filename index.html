<!DOCTYPE html>
<html>
    <body>
        <head>
            <a href="index.html"><img src="https://tse3.mm.bing.net/th/id/OIP.AE3vE0NzefRn1VqIZAst0wHaFP?r=0&pid=Api&h=220&P=0" alt="Zrydy Logo" width="100" height="100"></a>
            <title>
                Zrydy log in page
            </title>
             <link rel="stylesheet" href="script.css">
        <header><h1>LOG IN</h1></header>
        <fieldset>
            <legend>Log In Form</legend>
            <label for="name">Name:</label>
            <input type="text" placeholder="enter Full Name" required>
            <br>
             <label for="username">Username:</label>
            <input type="text" placeholder="enter Username" required>
             <br>
            <label for="email">Email:</label>
            <input type="email" placeholder="enter Email" required>
             <br>
            <label for="phone">Phone:</label>
            <input type="tel" placeholder="enter Phone Number" required>
             <br>
            <label for="address">Address:</label>
            <input type="text" placeholder="enter Address" required>ok do
             <br>
            <label for="password">Password:</label>
            <input type="password" placeholder="enter Password" required>
             <br>
            <label for="confirm password">Confirm Password:</label>
            <input type="password" placeholder="confirm Password" required>
             <br>
            <label for="dob">Date of Birth:</label>
            <input type="date" placeholder="enter Date of Birth" required>
             <br>
            <label for="gender">Gender:</label>
            <select>
                <option value="male">Male</option>
                <option value="female">Female</option>
                <optgroup label="Other">
                    <option value="non-binary">Non-binary</option>
                    <option value="prefer-not-to-say">Prefer not to say</option>
                </optgroup>
            </select>
             <br>
            <label for="country">Country:</label>
            <select>
                <option value="usa">United States</option>
                <option value="canada">Canada</option>
                <option value="uk">United Kingdom</option>
                <option value="australia">Australia</option>
                <option value="NG">Nigeria</option>
                <optgroup label="Other">
                    <option value="other">Other</option>
                </optgroup>
            </select>
             <br>
            <label for="state">State:</label>
            <select>
                <option value="lagos">Lagos</option>
                <option value="abuja">Abuja</option>
                <option value="rivers">Rivers</option>
                <option value="kano">Kano</option>
                <optgroup label="Other">
                    <option value="other">Other</option>
                </optgroup>
            </select>
             <br>
            <label for="city">City:</label>
            <input type="text" placeholder="enter City" required>
             <br>
            <label for="zip">Zip Code:</label>
            <input type="text" placeholder="enter Zip Code" required>
             <br>
            <form action="{{ url_for('signup') }}" method="POST">
                <label for="full_name">Full name:</label>
                <input type="text" id="full_name" name="full_name" placeholder="Enter your full name" required>
                <br>

                <label for="username">Username:</label>
                <input type="text" id="username" name="username" placeholder="Choose a username" required>
                <br>

                <label for="email">Email:</label>
                <input type="email" id="email" name="email" placeholder="Enter your email" required>
                <br>

                <label for="password">Password:</label>
                <input type="password" id="password" name="password" placeholder="Create a password" required>
                <br>

                <label for="confirm_password">Confirm password:</label>
                <input type="password" id="confirm_password" name="confirm_password" placeholder="Repeat your password" required>
                <br>

                <button type="submit">Create account</button>
