<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#20262b">
    <title>Zrydy Login</title>
    <link rel="manifest" href="{{ url_for('static', filename='manifest.json', v='20261005-z') }}">
    <link rel="icon" type="image/svg+xml" href="{{ url_for('static', filename='zrydy-icon.svg', v='1') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css', v='20261005') }}">
</head>
<body class="auth-page dark-mode">
    <div class="auth-container">
        <button class="auth-theme-toggle" type="button" data-theme-toggle aria-label="Toggle dark mode">Light mode</button>
        <img src="{{ url_for('static', filename='zrydy-icon.svg', v='1') }}" alt="Zrydy app icon" width="66" height="66">
        <h1>Welcome Back</h1>
        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                {% for category, message in messages %}
                    <div class="flash {{ category }}">{{ message }}</div>
                {% endfor %}
            {% endif %}
        {% endwith %}
        <form method="POST" action="{{ url_for('login') }}">
            <label for="username">Username</label>
            <input type="text" id="username" name="username" required>

            <label for="password">Password</label>
            <input type="password" id="password" name="password" required>

            <button type="submit">Login</button>
        </form>
        <p>Need an account? <a href="{{ url_for('index') }}">Sign Up</a></p>

        <footer>
            <a href="{{ url_for('about') }}">About</a>
            <a href="{{ url_for('contact') }}">Contact: 08113373935</a>
            <a href="{{ url_for('help_page') }}">Help</a>
            <a href="{{ url_for('faq_page') }}">FAQ</a>
        </footer>
    </div>
    <script src="{{ url_for('static', filename='theme.js') }}"></script>
</body>
</html>
