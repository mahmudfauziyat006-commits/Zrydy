<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#4f46e5">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="mobile-web-app-capable" content="yes">
    <title>Create Post</title>
    <link rel="manifest" href="{{ url_for('static', filename='manifest.json') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="auth-container">
        <h1>Create a Post</h1>
        <form method="POST" action="{{ url_for('create_post') }}" enctype="multipart/form-data">
            <label for="caption">Caption</label>
            <textarea id="caption" name="caption" rows="4" placeholder="What's on your mind?"></textarea>

            <label for="media">Upload image or video (maximum 10 minutes)</label>
            <input type="file" id="media" name="media" accept="image/*,video/*">

            <label for="camera">Take a photo or video</label>
            <input type="file" id="camera" name="camera_media" accept="image/*,video/*" capture="environment">

            <button type="submit">Post</button>
        </form>
        <p><a href="{{ url_for('dashboard') }}">Back to Feed</a></p>
    </div>
    <script>
        document.querySelector('form').addEventListener('submit', function (event) {
            const input = document.getElementById('media');
            const file = input.files && input.files[0];
            if (!file || !file.type.startsWith('video/')) return;
            event.preventDefault();
            const video = document.createElement('video');
            video.preload = 'metadata';
            video.onloadedmetadata = function () {
                URL.revokeObjectURL(video.src);
                if (video.duration > 600) {
                    alert('Videos must be 10 minutes or shorter.');
                    input.value = '';
                    return;
                }
                event.target.submit();
            };
            video.src = URL.createObjectURL(file);
        });
    </script>
</body>
</html>
